<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>National Super Admin Hub — GoldenHour EDS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }
    .brand-title { font-size: 18px; font-weight: 800; color: #a855f7; }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    .section-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 32px; }
    .card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 12px;
      padding: 20px;
    }
    .card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.5px; }
    .card-value { font-size: 26px; font-weight: 900; margin-top: 8px; }
    .regional-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .reg-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 10px;
      padding: 16px;
    }
    .reg-city { font-weight: 800; font-size: 15px; margin-bottom: 6px; color: #38bdf8; }
    @media (max-width: 1024px) { .grid, .regional-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="font-size: 24px;">👑</div>
      <div class="brand-title">National Super Admin Operations</div>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <a href="/" style="color: #38bdf8; text-decoration: none; font-size: 12px; font-weight: 600;">← Command Center</a>
      <button onclick="logout()" style="padding: 6px 12px; background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); border-radius: 6px; cursor: pointer; font-size: 12px;">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="section-title">Pan-India System Telemetry</div>
    <div class="grid">
      <div class="card">
        <div class="card-title">Registered Apex Hospitals</div>
        <div class="card-value" id="totHospVal" style="color:#38bdf8;">--</div>
      </div>
      <div class="card">
        <div class="card-title">Total ICU Bed Capacity</div>
        <div class="card-value" id="totBedsVal" style="color:#10b981;">--</div>
      </div>
      <div class="card">
        <div class="card-title">Emergency Fleet Size</div>
        <div class="card-value" id="totFleetVal" style="color:#a855f7;">--</div>
      </div>
      <div class="card">
        <div class="card-title">AI Dispatch Precision</div>
        <div class="card-value" style="color:#f59e0b;">96.4%</div>
      </div>
    </div>

    <div class="section-title">State & Regional Hub Performance</div>
    <div class="regional-grid" id="regionalGridContainer">
      <div style="color:#94a3b8;">Loading live regional cluster analytics...</div>
    </div>
  </div>

  <script>
    async function loadSuperAdminData() {
      try {
        const [metricsRes, analyticsRes] = await Promise.all([
          fetch('/api/metrics').then(r => r.json()),
          fetch('/api/analytics/regional').then(r => r.json())
        ]);

        if (metricsRes.success) {
          document.getElementById('totHospVal').textContent = metricsRes.data.totalHospitals;
          document.getElementById('totBedsVal').textContent = metricsRes.data.totalBeds;
          document.getElementById('totFleetVal').textContent = metricsRes.data.totalFleet;
        }

        if (analyticsRes.success && analyticsRes.data) {
          const container = document.getElementById('regionalGridContainer');
          const dist = analyticsRes.data.regionalHospitalDistribution || [];
          container.innerHTML = dist.map(r => `
            <div class="reg-card">
              <div class="reg-city">${r.city} (${r.state})</div>
              <div style="font-size:12px; color:#94a3b8; margin-top:4px;">
                Certified Hospitals: <b>${r.hospital_count}</b><br>
                Available ICU Beds: <b style="color:#34d399;">${r.available_beds}</b> / ${r.total_capacity}<br>
                Status: <span style="color:#10b981; font-weight:700;">🟢 ACTIVE</span>
              </div>
            </div>
          `).join('');
        }
      } catch (e) {
        console.error('Superadmin data load failed:', e);
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/login.html';
    }

    loadSuperAdminData();
    setInterval(loadSuperAdminData, 15000);
  </script>
</body>
</html>
