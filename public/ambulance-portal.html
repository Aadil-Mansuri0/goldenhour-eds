<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambulance Dashboard - GoldenHour</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 24px;
        background: rgba(15, 23, 42, 0.95);
        border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      }
      .brand-title { font-size: 18px; font-weight: 800; color: #1d4ed8; }
      .container {
        display: grid;
        grid-template-columns: 300px 1fr;
        min-height: calc(100vh - 65px);
      }
      .sidebar {
        background: rgba(15, 23, 42, 0.8);
        border-right: 1px solid rgba(148, 163, 184, 0.1);
        padding: 20px;
        overflow-y: auto;
      }
      .status-badge {
        display: inline-block;
        padding: 6px 10px;
        background: #10b981;
        color: white;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 16px;
      }
      .stat {
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.1);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
      }
      .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; }
      .stat-value { font-size: 20px; font-weight: 800; margin-top: 4px; }
      .map-container {
        padding: 20px;
        display: flex;
        flex-direction: column;
      }
      #map {
        flex: 1;
        border-radius: 12px;
        overflow: hidden;
      }
      .assignment {
        background: rgba(30, 41, 59, 0.8);
        border: 2px solid rgba(29, 78, 216, 0.3);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
        cursor: pointer;
      }
      .assignment-title { font-weight: 600; font-size: 12px; }
      .assignment-detail { font-size: 11px; color: #94a3b8; margin-top: 4px; }
      .btn { padding: 8px 12px; background: #1d4ed8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 8px; width: 100%; }
      .btn:hover { background: #1e40af; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="font-size: 24px;">🚑</div>
        <div style="display: flex; flex-direction: column;">
          <div class="brand-title">RJ14 AA 2211</div>
          <div style="font-size: 11px; color: #94a3b8;">Advanced Life Support</div>
        </div>
      </div>
      <button onclick="logout()" style="padding: 8px 14px; background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: none; border-radius: 6px; cursor: pointer;">Logout</button>
    </div>

    <div class="container">
      <div class="sidebar">
        <div class="status-badge">🟢 AVAILABLE</div>

        <div class="stat">
          <div class="stat-label">Battery</div>
          <div class="stat-value">92%</div>
        </div>
        <div class="stat">
          <div class="stat-label">Current Location</div>
          <div style="font-size: 11px; margin-top: 4px;">Jaipur City Center</div>
        </div>
        <div class="stat">
          <div class="stat-label">Crew</div>
          <div class="stat-value">2/2</div>
        </div>

        <div style="margin-top: 20px;">
          <div style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: #64748b; margin-bottom: 10px;">Active Assignment</div>
          <div class="assignment">
            <div class="assignment-title">Road Traffic Collision</div>
            <div class="assignment-detail">NH-48, Jaipur • 6 patients</div>
            <div class="assignment-detail" style="margin-top: 6px; color: #ef4444; font-weight: 600;">ETA 4 min</div>
            <button class="btn">Accept & Navigate</button>
          </div>
        </div>

        <div style="margin-top: 20px;">
          <div style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: #64748b; margin-bottom: 10px;">Pending Calls</div>
          <div class="assignment">
            <div class="assignment-title">Respiratory Distress</div>
            <div class="assignment-detail">Sanganer • 2 patients</div>
          </div>
        </div>
      </div>

      <div class="map-container">
        <div id="map"></div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const token = localStorage.getItem('token');
      if (!token) window.location.href = '/login.html';

      const map = L.map('map').setView([26.9124, 75.7873], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      L.marker([26.9124, 75.7873], { title: 'My Location' }).addTo(map)
        .bindPopup('Your ambulance<br>RJ14 AA 2211');

      function logout() {
        localStorage.clear();
        window.location.href = '/login.html';
      }
    </script>
  </body>
</html>
