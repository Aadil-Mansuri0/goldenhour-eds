<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dispatcher Command Center — GoldenHour EDS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-title { font-size: 18px; font-weight: 800; }
    .brand-title span { color: #ef4444; }
    .badge { 
      padding: 4px 10px; 
      background: rgba(239, 68, 68, 0.15); 
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 999px; 
      font-size: 10px;
      font-weight: 800;
      color: #fca5a5;
      text-transform: uppercase;
    }
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
    }
    .dashboard {
      display: grid;
      grid-template-columns: 320px 1fr 340px;
      min-height: calc(100vh - 65px);
    }
    .panel {
      background: rgba(15, 23, 42, 0.8);
      border-right: 1px solid rgba(148, 163, 184, 0.15);
      padding: 20px;
      overflow-y: auto;
    }
    .panel.right {
      border-right: none;
      border-left: 1px solid rgba(148, 163, 184, 0.15);
    }
    .panel-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .incident-card {
      padding: 12px;
      background: rgba(30, 41, 59, 0.8);
      border-left: 4px solid #ef4444;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .incident-card:hover {
      background: rgba(30, 41, 59, 1);
      transform: translateX(3px);
    }
    .incident-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
    .incident-meta { font-size: 11px; color: #94a3b8; }
    #map {
      width: 100%;
      height: 100%;
      min-height: 500px;
      background: #0f172a;
    }
    .stat-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
    .stat-value { font-size: 18px; font-weight: 800; margin-top: 2px; }
    @media (max-width: 1200px) {
      .dashboard { grid-template-columns: 1fr; }
      .panel { border-right: none; border-bottom: 1px solid rgba(148, 163, 184, 0.15); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div style="font-size: 24px;">🚨</div>
      <div>
        <div class="brand-title">Golden<span>Hour</span> Dispatcher Command Hub</div>
      </div>
      <div class="badge">LIVE TACTICAL STREAM</div>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <a href="/" style="color: #38bdf8; text-decoration: none; font-size: 12px; font-weight: 600;">← Main Application</a>
      <button class="btn" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5;" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="dashboard">
    <aside class="panel">
      <div class="panel-title">Active Emergency Calls</div>
      <div id="incidentList">Loading calls...</div>
      
      <div style="margin-top: 24px;">
        <div class="panel-title">Live Dispatch KPIs</div>
        <div class="stat-card">
          <div class="stat-label">Avg Response ETA</div>
          <div class="stat-value" id="kpiEta">5.2 mins</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Fleet Readiness</div>
          <div class="stat-value" id="kpiFleet">--</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total ICU Bed Capacity</div>
          <div class="stat-value" id="kpiBeds">--</div>
        </div>
      </div>
    </aside>

    <main style="position: relative;">
      <div id="map"></div>
    </main>

    <aside class="panel right">
      <div class="panel-title">Hospitals Online & Bed Capacity</div>
      <div id="hospitalList">Loading hospitals...</div>

      <div style="margin-top: 24px;">
        <div class="panel-title">Fleet Telemetry</div>
        <div id="ambulanceList">Loading units...</div>
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map;
    let markersLayer;

    async function init() {
      map = L.map('map').setView([26.9124, 75.7873], 12);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
      await loadDashboard();
      setInterval(loadDashboard, 15000);
    }

    async function loadDashboard() {
      try {
        const [dashRes, metricsRes] = await Promise.all([
          fetch('/api/dashboard').then(r => r.json()),
          fetch('/api/metrics').then(r => r.json())
        ]);

        if (!dashRes.success) return;

        const incidents = dashRes.data.map.incidents || [];
        const hospitals = dashRes.data.map.hospitals || [];
        const ambulances = dashRes.data.map.ambulances || [];

        if (metricsRes.success) {
          document.getElementById('kpiEta').textContent = `${metricsRes.data.avgResponseMinutes} mins`;
          document.getElementById('kpiFleet').textContent = `${metricsRes.data.availableAmbulances} / ${metricsRes.data.totalFleet} Available`;
          document.getElementById('kpiBeds').textContent = `${metricsRes.data.totalBeds} Beds`;
        }

        // Render Incidents List
        const incidentListEl = document.getElementById('incidentList');
        incidentListEl.innerHTML = incidents.length ? incidents.map(inc => `
          <div class="incident-card" onclick="flyToLoc(${inc.latitude}, ${inc.longitude})">
            <div class="incident-title">${inc.title}</div>
            <div class="incident-meta">📍 ${inc.location} • ${inc.patient_count || 1} injured</div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
              <span style="font-size:11px; color:#ef4444; font-weight:700;">${inc.severity.toUpperCase()}</span>
              ${inc.status === 'active' ? `<button class="btn" style="background:#38bdf8; color:#0b1120; padding:2px 8px; font-size:10px;" onclick="dispatchCall('${inc.id}', event)">Dispatch</button>` : `<span style="font-size:10px; color:#34d399; font-weight:700;">DISPATCHED</span>`}
            </div>
          </div>
        `).join('') : '<div style="color:#94a3b8; font-size:12px;">No active emergency incidents.</div>';

        // Render Hospitals
        const hospitalListEl = document.getElementById('hospitalList');
        hospitalListEl.innerHTML = hospitals.slice(0, 5).map(h => `
          <div class="stat-card" onclick="flyToLoc(${h.latitude}, ${h.longitude})">
            <div style="font-weight:700; font-size:13px;">${h.name}</div>
            <div style="font-size:11px; color:#34d399; margin-top:2px;">${h.available_beds} beds available (${h.trauma_level})</div>
          </div>
        `).join('');

        // Render Ambulances
        const ambListEl = document.getElementById('ambulanceList');
        ambListEl.innerHTML = ambulances.slice(0, 5).map(a => `
          <div class="stat-card">
            <div style="display:flex; justify-content:space-between;">
              <b>${a.vehicle_number}</b>
              <span style="font-size:11px; color:${a.status === 'available' ? '#34d399' : '#a855f7'}; font-weight:700;">${a.status.toUpperCase()}</span>
            </div>
            <div style="font-size:11px; color:#94a3b8; margin-top:2px;">Battery: ${a.battery}% • ${a.city || 'Regional Sector'}</div>
          </div>
        `).join('');

        // Update Map Markers
        markersLayer.clearLayers();
        incidents.forEach(inc => {
          const icon = L.divIcon({
            className: 'c-icon',
            html: `<div style="background:#ef4444; width:22px; height:22px; border-radius:50%; border:2px solid #fff; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px;">🚨</div>`
          });
          L.marker([inc.latitude, inc.longitude], { icon }).bindPopup(`<b>${inc.title}</b><br>${inc.location}`).addTo(markersLayer);
        });

        hospitals.forEach(h => {
          const icon = L.divIcon({
            className: 'c-icon',
            html: `<div style="background:#0f172a; width:22px; height:22px; border-radius:6px; border:2px solid #ef4444; display:flex; align-items:center; justify-content:center; color:#ef4444; font-size:12px;">🏥</div>`
          });
          L.marker([h.latitude, h.longitude], { icon }).bindPopup(`<b>${h.name}</b><br>Beds: ${h.available_beds}`).addTo(markersLayer);
        });
      } catch (e) {
        console.error('Dispatcher load error:', e);
      }
    }

    async function dispatchCall(incidentId, event) {
      if (event) event.stopPropagation();
      try {
        const res = await fetch('/api/dispatch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ incidentId })
        });
        const data = await res.json();
        if (data.success) {
          alert(`Ambulance ${data.data.ambulanceNumber} dispatched to Incident ${incidentId}!`);
          loadDashboard();
        }
      } catch (e) {
        alert('Dispatch failed.');
      }
    }

    function flyToLoc(lat, lng) {
      if (map) map.flyTo([lat, lng], 14);
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/login.html';
    }

    init();
  </script>
</body>
</html>
