<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report Emergency - GoldenHour Citizen</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        width: 100%;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      }
      .header {
        text-align: center;
        margin-bottom: 32px;
      }
      .icon { font-size: 48px; margin-bottom: 12px; }
      .title {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 8px;
      }
      .subtitle {
        font-size: 13px;
        color: #94a3b8;
      }
      .form-group {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #cbd5e1;
        margin-bottom: 8px;
      }
      input, textarea, select {
        width: 100%;
        padding: 12px 14px;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 10px;
        color: #e2e8f0;
        font-size: 14px;
      }
      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: #ef4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
      }
      textarea {
        resize: vertical;
        min-height: 100px;
      }
      .btn-submit {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #dc2626, #ef4444);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
      }
      .success-message {
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.3);
        color: #a7f3d0;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        display: none;
      }
      .success-message.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="icon">🆘</div>
        <div class="title">Report Emergency</div>
        <div class="subtitle">GoldenHour Emergency Response</div>
      </div>

      <div id="successMessage" class="success-message">
        ✓ Incident reported successfully. Help is on the way.
      </div>

      <form onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label>Emergency Type</label>
          <select required>
            <option value="">Select type...</option>
            <option value="Trauma">Road Traffic Collision</option>
            <option value="Cardiac">Chest Pain / Cardiac</option>
            <option value="Pulmonary">Respiratory Distress</option>
            <option value="Fall">Fall Injury</option>
            <option value="Medical">Medical Emergency</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Severity Level</label>
          <select required>
            <option value="">Select severity...</option>
            <option value="critical">Critical / Life-threatening</option>
            <option value="high">High / Urgent</option>
            <option value="medium">Medium / Moderate</option>
            <option value="low">Low / Minor</option>
          </select>
        </div>

        <div class="form-group">
          <label>Location</label>
          <input type="text" placeholder="Street address or landmark" required />
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea placeholder="Describe the emergency situation..." required></textarea>
        </div>

        <div class="form-group">
          <label>Number of Patients</label>
          <input type="number" min="1" value="1" required />
        </div>

        <button type="submit" class="btn-submit">📞 Call Emergency Services</button>
      </form>
    </div>

    <script>
      const token = localStorage.getItem('token');

      async function handleSubmit(event) {
        event.preventDefault();
        const form = event.target;
        const data = new FormData(form);

        try {
          const response = await fetch('/api/incidents', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': token ? `Bearer ${token}` : ''
            },
            body: JSON.stringify({
              title: data.get('type') || 'Emergency',
              type: data.get('type'),
              severity: data.get('severity'),
              location: data.get('location'),
              patient_count: data.get('patient_count'),
              latitude: 26.9124,
              longitude: 75.7873,
              region: 'jaipur'
            })
          });

          if (response.ok) {
            document.getElementById('successMessage').classList.add('show');
            form.reset();
            setTimeout(() => {
              document.getElementById('successMessage').classList.remove('show');
            }, 4000);
          }
        } catch (error) {
          console.error('Error reporting incident:', error);
        }
      }
    </script>
  </body>
</html>
