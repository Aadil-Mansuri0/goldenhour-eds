<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#0b1120;border-radius:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGlow)" rx="16"/>

  <!-- Decorative Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(60, 48)">
    <rect width="210" height="30" rx="15" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.4"/>
    <circle cx="16" cy="15" r="5" fill="#ef4444" filter="url(#glow)"/>
    <text x="32" y="19" font-size="11" font-weight="700" fill="#fca5a5" letter-spacing="1.2">ENTERPRISE SYSTEM v6.0</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="130" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
    GoldenHour <tspan fill="url(#redGrad)">EDS</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="60" y="165" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Next-Gen Emergency Dispatch Intelligence, Live Telemetry &amp; AI Triage Platform
  </text>

  <!-- Key Metric Cards -->
  <!-- Card 1: Response Time SLA -->
  <g transform="translate(60, 210)">
    <rect width="245" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
    <rect width="245" height="4" rx="2" fill="url(#redGrad)"/>
    <text x="20" y="38" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.8">TARGET SLA DISPATCH</text>
    <text x="20" y="85" font-size="36" font-weight="800" fill="#ffffff">&lt; 8.0 <tspan font-size="18" fill="#ef4444" font-weight="600">min</tspan></text>
    <text x="20" y="125" font-size="12" font-weight="500" fill="#22c55e">⚡ 99.4% Critical Compliance</text>
  </g>

  <!-- Card 2: AI Readiness -->
  <g transform="translate(330, 210)">
    <rect width="245" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
    <rect width="245" height="4" rx="2" fill="url(#blueGrad)"/>
    <text x="20" y="38" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.8">AI TRIAGE READINESS</text>
    <text x="20" y="85" font-size="36" font-weight="800" fill="#ffffff">94.8 <tspan font-size="18" fill="#38bdf8" font-weight="600">/ 99</tspan></text>
    <text x="20" y="125" font-size="12" font-weight="500" fill="#38bdf8">🤖 Real-time Demand Forecast</text>
  </g>

  <!-- Card 3: Multi-Role Portals -->
  <g transform="translate(600, 210)">
    <rect width="245" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
    <rect width="245" height="4" rx="2" fill="#10b981"/>
    <text x="20" y="38" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.8">PORTAL ECOSYSTEM</text>
    <text x="20" y="85" font-size="36" font-weight="800" fill="#ffffff">6 <tspan font-size="18" fill="#34d399" font-weight="600">Roles</tspan></text>
    <text x="20" y="125" font-size="12" font-weight="500" fill="#34d399">🔒 RBAC + JWT Verified</text>
  </g>

  <!-- Card 4: Architecture -->
  <g transform="translate(870, 210)">
    <rect width="270" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
    <rect width="270" height="4" rx="2" fill="#a855f7"/>
    <text x="20" y="38" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.8">CLOUD INFRASTRUCTURE</text>
    <text x="20" y="85" font-size="28" font-weight="800" fill="#ffffff">K8s + Docker</text>
    <text x="20" y="125" font-size="12" font-weight="500" fill="#c084fc">🚀 Redis + WebSockets Live</text>
  </g>
</svg>
