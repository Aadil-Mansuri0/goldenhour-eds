version: '3.9'

services:
  app:
    build: .
    container_name: goldenhour-app
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: dev-secret
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: goldenhour-redis
    ports:
      - '6379:6379'
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: goldenhour-postgres
    environment:
      POSTGRES_DB: goldenhour
      POSTGRES_USER: goldenhour
      POSTGRES_PASSWORD: goldenhour123
    ports:
      - '5432:5432'
    restart: unless-stopped
